name: KiCad PDFs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kicad-pdfs-${{ github.ref }}
  # Finish a production deployment before starting the next main build.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Generate PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # KiCad 10.0.8; the digest also pins the underlying build environment.
      image: ghcr.io/kicad/kicad:10.0.8@sha256:3f4a01786dfbe803a65f345c3342b765db9add913f5e9448f8356793714ddc34
      options: --user 0
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out design files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate schematic and layout PDFs
        run: |
          # The container user differs from the owner of the mounted checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/export-pdfs.sh
          git diff --exit-code -- kicad/

      - name: Upload PDFs for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kicad-pdfs
          path: output/pdf/
          if-no-files-found: error
          retention-days: 14

      - name: Package Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output/pdf/

  deploy:
    name: Publish PDFs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this is still the latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/main"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              head = json.load(response)["object"]["sha"]
          current = head == os.environ["GITHUB_SHA"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"current={str(current).lower()}\n")
          if not current:
              print("A newer main commit exists; skipping publication of this older build.")
          PY

      - name: Configure Pages
        if: steps.latest.outputs.current == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages
        if: steps.latest.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
